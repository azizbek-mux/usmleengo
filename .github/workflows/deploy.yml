name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild on a timer so a newly tagged channel post reaches the app without
  # anyone touching the repository. GitHub disables scheduled workflows after
  # 60 days of repository inactivity — any push re-enables them.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pulls the tagged channel post into public/announcement.json. Never
      # fails the build: no announcement is a normal state.
      - run: npm run announcement
      # Adds scores players sent to the bot since the last build, on top of
      # the board already live, into public/leaderboard.json. Needs the
      # BOT_TOKEN repository secret to read new scores; without it the live
      # board is carried forward unchanged. Fails the build only if the live
      # board exists but cannot be read — deploying without it would wipe it.
      - run: npm run leaderboard
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
