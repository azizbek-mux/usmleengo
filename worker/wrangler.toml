# The rating server. Deployed from this folder with `npx wrangler deploy`.
# See the README section "The rating server" for the one-time setup.

name = "usmleengo-rating"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Created with `npx wrangler d1 create usmleengo-rating` (region EEUR). The id
# is not a secret: it is useless without the account's own login.
[[d1_databases]]
binding = "DB"
database_name = "usmleengo-rating"
database_id = "e7670b05-973a-47e2-b0bc-721253e641b8"

# BOT_TOKEN is a secret, never written here. Set it in the Cloudflare
# dashboard (Workers → usmleengo-rating → Settings → Variables and Secrets).
